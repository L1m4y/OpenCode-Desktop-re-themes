    <text x="231" y="198">#FAB283</text>
    <text x="317" y="198">#12C905</text>
    <text x="403" y="198">#FCD53A</text>
    <text x="489" y="198">#FC533A</text>
    <text x="575" y="198">#EDB2F1</text>
    <text x="661" y="198">#034CFF</text>
