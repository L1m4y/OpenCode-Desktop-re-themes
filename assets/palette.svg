<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Graphite Palette">
  <style>
    text { fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) { text { fill: #f2f2f2; } }
  </style>
  <text x="360" y="48" text-anchor="middle" font-family='Noto Sans, Helvetica, Arial, sans-serif' font-size="24" font-weight="700">Graphite Palette</text>
  <g stroke="#7a7a7a" stroke-width="1.25">
    <rect x="23"  y="76" width="72" height="80" rx="3" fill="#323232"/>
    <rect x="109" y="76" width="72" height="80" rx="3" fill="#EDEDED"/>
    <rect x="195" y="76" width="72" height="80" rx="3" fill="#FAB283"/>
